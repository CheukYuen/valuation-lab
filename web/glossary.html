<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>白话术语表 · 估值判断力实验室</title>
  <meta name="description" content="18个估值术语的白话解释，收入到每股价值一条主线。">
  <link rel="stylesheet" href="assets/styles.css">
  <script defer src="assets/glossary.js"></script>
  <script defer src="assets/app.js"></script>
</head>
<body class="reader-page site-page">
  <header class="reader-topbar">
    <a class="reader-brand" href="index.html" aria-label="返回课程首页">
      <span class="reader-brand-mark" aria-hidden="true">V</span>
      <span><strong>估值实验室</strong><small>看懂估值，不迷信数字</small></span>
    </a>
    <div class="reader-heading">
      <div class="reader-breadcrumb">
        <span>7天估值判断课</span><b>/</b><strong>术语表</strong>
      </div>
      <div class="reader-course-progress" aria-label="课程进度"><div class="day-dots" data-day-dots></div><small data-progress-text>0/7</small></div>
    </div>
    <nav class="reader-actions" aria-label="辅助导航"><a href="index.html">课程首页</a><a aria-current="page" href="glossary.html">术语表</a><a href="study-methods.html">学习方法</a></nav>
  </header>
  <div class="reader-shell">
  <main class="page reader-content">
    <section class="hero">
      <p class="eyebrow">GLOSSARY · 白话术语表</p>
      <h1>只记一条主线</h1>
      <p>收入 → EBIT → NOPAT → FCFF → EV → 股权价值 → 每股价值。每个英文缩写都写出全称，例如 EBIT = Earnings Before Interest and Taxes。这页和 <a href="../docs/GLOSSARY.md" style="color:#d7e3dc">docs/GLOSSARY.md</a> 保持一致。</p>
    </section>
    <section class="section">
      <p class="eyebrow">SEARCH</p><h2>18 个术语</h2>
      <input class="term-search" type="search" placeholder="搜索术语，例如 桥、FCFF、OCF、终值、EPS、PE…" data-term-search aria-label="搜索术语">
      <div class="term-grid" data-term-grid>      </div>
    </section>
  </main>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const grid = document.querySelector("[data-term-grid]");
      const search = document.querySelector("[data-term-search]");
      const entries = Object.values(globalThis.ValuationLabGlossary || {});
      grid.innerHTML = entries.map(entry => `
        <article class="term-card" data-term-card data-term-name="${entry.term.toLowerCase()}">
          <h3>${entry.term}</h3>
          ${entry.expand ? `<p class="term-expand">英文全称：${entry.expand}</p>` : ""}
          <p>${entry.short}</p>
          ${entry.formula ? `<code>${entry.formula}</code>` : ""}
          ${entry.caution ? `<p class="caution">${entry.caution}</p>` : ""}
        </article>
      `).join("");
      search.addEventListener("input", () => {
        const query = search.value.trim().toLowerCase();
        document.querySelectorAll("[data-term-card]").forEach(card => {
          const haystack = card.textContent.toLowerCase();
          card.classList.toggle("search-hidden", Boolean(query) && !haystack.includes(query));
        });
      });
    });
  </script>
</body>
</html>
